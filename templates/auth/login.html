{% extends "base.html" %}
{% block title %}Sign in | Makhzoon{% endblock %}
{% block content %}
<section class="row justify-content-center">
<div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
<div class="text-center mb-4">
<span class="temporary-mark d-inline-grid mb-3" aria-hidden="true">MZ</span>
<h1 class="h3 mb-2">Sign in to Makhzoon</h1>
<p class="text-muted mb-0">Access your inventory and order workspace.</p>
</div>
<div class="card content-card">
<div class="card-body p-4">
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3">
<label class="form-label" for="login-email">Email</label>
<input class="form-control" id="login-email" name="email" type="email" value="{{ email }}" autocomplete="username" maxlength="254" required autofocus>
</div>
<div class="mb-3">
<div class="d-flex justify-content-between gap-3">
<label class="form-label" for="login-password">Password</label>
<a class="small" href="{{ url_for('forgot_password') }}">Forgot password?</a>
</div>
<input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required>
</div>
<button class="btn btn-primary w-100" type="submit">Sign in</button>
</form>
</div>
</div>
</div>
</section>
{% endblock %}
