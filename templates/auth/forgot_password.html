{% extends "base.html" %}
{% block title %}Reset password | Makhzoon{% endblock %}
{% block content %}
<section class="row justify-content-center">
<div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
<div class="text-center mb-4">
<span class="temporary-mark d-inline-grid mb-3" aria-hidden="true">MZ</span>
<h1 class="h3 mb-2">Reset your password</h1>
<p class="text-muted mb-0">We will send a single-use reset link if an active account matches.</p>
</div>
<div class="card content-card">
<div class="card-body p-4">
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3">
<label class="form-label" for="reset-email">Email</label>
<input class="form-control" id="reset-email" name="email" type="email" autocomplete="email" maxlength="254" required autofocus>
</div>
<button class="btn btn-primary w-100" type="submit">Send reset link</button>
</form>
<a class="btn btn-link w-100 mt-2" href="{{ url_for('login') }}">Back to sign in</a>
</div>
</div>
</div>
</section>
{% endblock %}
